      /* Visually hidden; the name is revealed by the moiré, not by markup. */

<body>
  <h1>Lucas J. Shuman</h1>
  <canvas id="c" aria-hidden="true"></canvas>

  <script id="vs" type="x-shader/x-vertex">
attribute vec2 aPos;
void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
</script>

  <script id="fs" type="x-shader/x-fragment">
precision highp float;

uniform vec2  uRes;       // canvas size, device px
uniform float uTime;
uniform float uTile;      // mosaic tile size, device px
uniform sampler2D uMask;  // text mask, one texel per tile
uniform sampler2D uMaskB; // next message's mask, while switching
uniform float uMix;       // 0..1 progress of the switch
uniform vec2  uMaskRes;
uniform float uK;         // grating wavenumber
uniform float uSpin;      // whole-field rotation
uniform float uAngle;     // rotation of grating B relative to A
uniform vec2  uOffset;    // translation of grating B
uniform float uCurve;     // curvature difference of grating B
uniform float uPhase;     // phase slide of grating B
uniform float uShift;     // phase shift of grating A inside the letters
uniform float uReveal;
uniform vec3  uBg;                // palette background
uniform vec3  uInk0, uInk1, uInk2; // one ink per dispersed channel
uniform float uDisp;         // per-channel wavelength spread

const float TAU = 6.2831853;

float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
mat2 rot(float a) { float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }

void main() {
  // --- mosaic: every tile samples the field once, at its centre ---
  vec2 frag  = gl_FragCoord.xy;
  vec2 cell  = floor(frag / uTile);
  vec2 local = fract(frag / uTile) - 0.5;
  vec2 c     = (cell + 0.5) * uTile;
  vec2 p     = rot(uSpin) * ((c - 0.5 * uRes) / uRes.y);

  // --- hidden text: encoded as a phase shift in grating A ---
  vec2 muv = (cell + 0.5) / uMaskRes;
  float mA = step(0.5, texture2D(uMask, muv).r);
  float mB = step(0.5, texture2D(uMaskB, muv).r);
  float m  = mix(mA, mB, step(hash(cell + 31.7), uMix));   // tiles flip over one by one

  // --- two parabolic gratings: lines follow y = -a·x² ---
  float fa = p.y + 0.4 * p.x * p.x;
  vec2  pb = rot(uAngle) * (p - uOffset);
  float fb = pb.y + (0.4 + uCurve) * pb.x * pb.x;

  // each channel diffracts at a slightly different wavelength
  vec3 lam = vec3(1.0, 1.0 + uDisp, 1.0 + 2.0 * uDisp);
  vec3 phA = uK * lam * fa + m * uShift;
  vec3 phB = uK * lam * fb + uPhase;

  vec3 gA = 0.5 + 0.5 * cos(phA);
  vec3 gB = 0.5 + 0.5 * cos(phB);
  vec3 fine = gA * gB;                          // overlaid transparencies
  vec3 beat = 0.5 + 0.5 * cos(phA - phB);       // what the eye integrates

  vec3 lum = fine * (0.3 + 1.3 * beat) * 1.6;

  // three inks, one per channel: where the channels agree the inks stack toward light,
  // where dispersion pulls them apart each ink shows on its own
  vec3 ink = uInk0 * lum.r + uInk1 * lum.g + uInk2 * lum.b;
  float drift = 1.0 + 0.12 * sin(1.7 * p.x - 1.1 * p.y + 0.05 * uTime);
  vec3 col = uBg + (1.0 - exp(-ink * 0.65 * drift));

  // --- tesserae: per-tile variance, bevel, grout ---
  float j = hash(cell);
  col *= 0.86 + 0.28 * j;
  col *= 1.0 + 0.16 * (local.y - local.x);
  float edge  = max(abs(local.x), abs(local.y));
  float grout = 1.0 - smoothstep(0.5 - 1.3 / uTile, 0.5 - 0.25 / uTile, edge);
  col = mix(uBg * 0.6, col, grout);

  // vignette
  vec2 q = (frag - 0.5 * uRes) / uRes;
  col *= 1.0 - 0.55 * dot(q, q);

  gl_FragColor = vec4(pow(max(col, 0.0), vec3(0.88)), 1.0);
}
</script>

  <script>
    (() => {
      // ---------- configuration ----------
      // Scroll steps through these; the first is shown on load. A comma that ends up at a line
      // break is dropped. Pick a start with ?msg=<index>.
      const MESSAGES = ["LUCAS IS HUMAN.", "PORTLAND OREGON", "CODE PHOTO RUN."];
      const SCROLL_STEP = 450;    // scroll distance (px) per message
      const FONT = '"Archivo Black", "Arial Black", Impact, sans-serif';
      const PERIOD_TILES = 5.0;   // grating period at centre, in mosaic tiles
      // "time" blends night → dawn → day → dusk with the local clock, "random" picks one per
      // load, or name a palette. Override with ?palette=<mode|name>; test times with ?hour=<0-24>.
      const PALETTE = "time";
      const DISPERSION = 0.07;    // how far the three inks split apart in the fringes
      // Inks are ordered base, accent, light. The four clock palettes keep similar hues in each
      // slot so the cross-fades between them stay short trips around the colour wheel.
      const PALETTES = {          // background, then one ink per channel
        night: ["#03040b", "#2a45d8", "#9a7cff", "#ffcf9e"],
        dawn: ["#0b0609", "#8a6cff", "#ff5e5b", "#ffb86b"],
        day: ["#050908", "#16a39a", "#ff5a2e", "#f1e4c8"],
        dusk: ["#0a040c", "#4b2fd6", "#d42a6f", "#ff8f3a"],
        ember: ["#0a0507", "#b8321f", "#ff8a3d", "#ffd08a"],
        ocean: ["#03080f", "#1d5fa0", "#2fb8c4", "#a8f0e6"],
        violet: ["#08050f", "#6d2bb8", "#d64fa0", "#ffa3cf"],
        acid: ["#060806", "#3f6b12", "#b8e62e", "#f0ff9a"],
      };
      const DAY = [[0, "night"], [6, "dawn"], [12, "day"], [18, "dusk"], [24, "night"]];

      const canvas = document.getElementById("c");
      // ?still=<reveal 0..1>&t=<seconds>[&tile=<css px>] freezes one frame (used to render og.png).
      const params = new URLSearchParams(location.search);
      const still = params.has("still")
        ? {
          r: parseFloat(params.get("still")) || 0,
          t: parseFloat(params.get("t")) || 0,
          tile: parseFloat(params.get("tile")) || 0,
        }
        : null;
      const gl = canvas.getContext("webgl", { antialias: false, alpha: false, preserveDrawingBuffer: false });
      if (!gl) { document.body.classList.add("nogl"); return; }

      // ---------- GL setup ----------
      function compile(type, src) {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
        return s;
      }
      const prog = gl.createProgram();
      gl.attachShader(prog, compile(gl.VERTEX_SHADER, document.getElementById("vs").textContent));
      gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, document.getElementById("fs").textContent));
      gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
      gl.useProgram(prog);

      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
      const aPos = gl.getAttribLocation(prog, "aPos");
      gl.enableVertexAttribArray(aPos);
      gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

      const U = {};
      ["uRes", "uTime", "uTile", "uMask", "uMaskB", "uMix", "uMaskRes", "uK", "uSpin",
        "uAngle", "uOffset", "uCurve", "uPhase", "uShift", "uReveal", "uBg", "uInk0", "uInk1", "uInk2", "uDisp"]
        .forEach(n => U[n] = gl.getUniformLocation(prog, n));

      const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255);
      const PAL_KEYS = ["uBg", "uInk0", "uInk1", "uInk2"];
      const setPalette = cols => PAL_KEYS.forEach((n, i) => gl.uniform3fv(U[n], cols[i]));
      const paletteRGB = name => PALETTES[name].map(hex);

      const TAU = Math.PI * 2;
      // Blend in OKLCH so a cross-fade turns hue around the wheel instead of passing through grey.
      const toLin = c => (c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4);
      const toSrgb = c => (c <= 0.0031308 ? 12.92 * c : 1.055 * c ** (1 / 2.4) - 0.055);
      function oklch([r, g, b]) {
        [r, g, b] = [r, g, b].map(toLin);
        const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
        const m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
        const q = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
        const L = 0.2104542553 * l + 0.793617785 * m - 0.0040720468 * q;
        const A = 1.9779984951 * l - 2.428592205 * m + 0.4505937099 * q;
        const B = 0.0259040371 * l + 0.7827717662 * m - 0.808675766 * q;
        return [L, Math.hypot(A, B), Math.atan2(B, A)];
      }
      function fromOklch([L, C, h]) {
        const A = C * Math.cos(h), B = C * Math.sin(h);
        const l = (L + 0.3963377774 * A + 0.2158037573 * B) ** 3;
        const m = (L - 0.1055613458 * A - 0.0638541728 * B) ** 3;
        const q = (L - 0.0894841775 * A - 1.291485548 * B) ** 3;
        return [
          4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * q,
          -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * q,
          -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * q,
        ].map(c => Math.min(1, Math.max(0, toSrgb(Math.max(0, c)))));
      }
      function lerpOklch(a, b, k) {
        const [L0, C0, h0] = oklch(a), [L1, C1, h1] = oklch(b);
        let dh = h1 - h0;
        if (dh > Math.PI) dh -= TAU;
        if (dh < -Math.PI) dh += TAU;
        return fromOklch([L0 + (L1 - L0) * k, C0 + (C1 - C0) * k, h0 + dh * k]);
      }

      // Hold each key palette for a few hours, cross-fade over the middle of each gap.
      function paletteAt(hour) {
        let i = 0;
        while (DAY[i + 1][0] <= hour) i++;
        const [h0, a] = DAY[i], [h1, b] = DAY[i + 1];
        const f = (hour - h0) / (h1 - h0);
        const u = Math.min(1, Math.max(0, (f - 0.35) / 0.3));
        const k = u * u * (3 - 2 * u);
        const A = paletteRGB(a), B = paletteRGB(b);
        return A.map((c, j) => lerpOklch(c, B[j], k));
      }

      const mode = params.get("palette") || PALETTE;
      const fixedHour = params.has("hour") ? parseFloat(params.get("hour")) % 24 : null;
      const localHour = () => {
        const d = new Date();
        return d.getHours() + d.getMinutes() / 60;
      };
      const followClock = !(mode in PALETTES) && mode !== "random";
      if (mode in PALETTES) setPalette(paletteRGB(mode));
      else if (mode === "random") {
        const names = Object.keys(PALETTES);
        setPalette(paletteRGB(names[Math.floor(Math.random() * names.length)]));
      } else setPalette(paletteAt(fixedHour ?? localHour()));
      gl.uniform1f(U.uDisp, DISPERSION);
      if (followClock && fixedHour === null) setInterval(() => setPalette(paletteAt(localHour())), 60000);

      // One mask texture per message; the shader reads the current one on unit 0 and the one
      // being switched to on unit 1.
      function makeTex() {
        const t = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, t);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        return t;
      }
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
      const maskTex = MESSAGES.map(makeTex);
      gl.uniform1i(U.uMask, 0);
      gl.uniform1i(U.uMaskB, 1);

      const startMsg = Math.min(MESSAGES.length - 1, Math.max(0, parseInt(params.get("msg"), 10) || 0));
      const msg = { from: startMsg, to: startMsg, k: 1, acc: 0, lock: 0 };
      function bindMasks() {
        gl.activeTexture(gl.TEXTURE1);
        gl.bindTexture(gl.TEXTURE_2D, maskTex[msg.to]);
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, maskTex[msg.from]);
      }
      function stepMessage(dir) {
        if (msg.k < 1) msg.from = msg.to;   // mid-switch: land the current one, start the next
        msg.to = (msg.to + dir + MESSAGES.length) % MESSAGES.length;
        msg.k = 0;
        bindMasks();
      }

      // ---------- text mask (one pixel per mosaic tile → blocky letters) ----------
      const mc = document.createElement("canvas");
      const mctx = mc.getContext("2d", { willReadFrequently: false });

      // All messages share one letter grid: a space takes one cell, the same number of cells per line
      // and the same size for every message, so they line up column for column. The column count
      // is whatever gives the largest letters with the longest message still fitting the view.
      const LH = 0.86;      // line step, em (Archivo Black caps ≈ 0.72em)
      const TRACK = 0.1;    // gap between letter cells, em
      const TEXTS = MESSAGES.map(m => m.trim().replace(/\s+/g, " "));
      let grid = null;

      function layoutGrid(mw, mh) {
        mctx.font = `100px ${FONT}`;
        try { mctx.letterSpacing = "0px"; } catch (_) {}
        const chars = [...new Set(TEXTS.join("").replace(/ /g, ""))];
        const cellEm = Math.max(...chars.map(c => mctx.measureText(c).width)) / 100 + TRACK;
        const boxW = mw * 0.88, boxH = mh * 0.7;
        const longest = Math.max(...TEXTS.map(t => t.length));
        let best = null;
        for (let cols = 1; cols <= longest; cols++) {
          const rows = Math.max(...TEXTS.map(t => Math.ceil(t.length / cols)));
          const size = Math.min(boxW / (cols * cellEm), boxH / (rows * LH));
          if (!best || size > best.size) best = { cols, size };
        }
        // snap the cell and line step to whole tiles so every letter sits on the mosaic grid
        const cell = Math.max(1, Math.floor(best.size * cellEm));
        const size = Math.floor(cell / cellEm);
        grid = { cols: best.cols, cell, size, step: Math.max(1, Math.round(size * LH)) };
      }

      function buildMask(text, tex, mw, mh) {
        mc.width = mw;
        mc.height = mh;
        mctx.fillStyle = "#000";
        mctx.fillRect(0, 0, mw, mh);

        const { cols, cell, size, step } = grid;
        mctx.font = `${size}px ${FONT}`;
        try { mctx.letterSpacing = "0px"; } catch (_) {}
        mctx.fillStyle = "#fff";
        mctx.textAlign = "center";
        mctx.textBaseline = "middle";
        const rows = Math.ceil(text.length / cols);
        const x0 = Math.round((mw - cols * cell) / 2);
        const y0 = Math.round(mh / 2 - (step * (rows - 1)) / 2 + size * 0.04);
        [...text].forEach((ch, i) => {
          const col = i % cols, row = Math.floor(i / cols);
          mctx.fillText(ch, x0 + (col + 0.5) * cell, y0 + row * step);
        });

        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, mc);
      }

      // ---------- sizing ----------
      let W = 0, H = 0, tile = 8;
      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = Math.floor(innerWidth * dpr);
        H = Math.floor(innerHeight * dpr);
        canvas.width = W;
        canvas.height = H;
        gl.viewport(0, 0, W, H);
        const tileCss = still && still.tile ? still.tile : Math.min(12, Math.max(5, Math.min(innerWidth, innerHeight) / 115));
        tile = Math.max(3, Math.round(tileCss * dpr));
        const mw = Math.ceil(W / tile), mh = Math.ceil(H / tile);
        layoutGrid(mw, mh);
        TEXTS.forEach((text, i) => buildMask(text, maskTex[i], mw, mh));
        bindMasks();
        gl.uniform2f(U.uRes, W, H);
        gl.uniform1f(U.uTile, tile);
        gl.uniform2f(U.uMaskRes, mw, mh);
        gl.uniform1f(U.uK, (Math.PI * 2 * (H / tile)) / PERIOD_TILES);
      }
      addEventListener("resize", resize);
      resize();
      if (document.fonts && document.fonts.load) {
        document.fonts.load(`100px "Archivo Black"`).then(resize, () => {});
      }

      // ---------- input → motion energy ----------
      const s = {
        mx: 0, my: 0, tmx: 0, tmy: 0,
        energy: 0, reveal: 0,
        scroll: 0, scrollS: 0, phase: 0, twist: 0,
        px: null, py: null,
      };
      const bump = e => { s.energy = Math.min(1.8, s.energy + e); };

      // Scroll spins the field and twists the gratings apart; every SCROLL_STEP in one direction
      // moves to the next (or previous) message. A short lock after each step keeps a long
      // trackpad flick from skipping through several.
      function scrollBy(d) {
        s.scroll += d;
        s.twist = Math.max(-0.3, Math.min(0.3, s.twist + d * 0.0005));
        bump(Math.min(Math.abs(d), 160) / 520);
        if (performance.now() < msg.lock) { msg.acc = 0; return; }
        if (Math.sign(d) !== Math.sign(msg.acc)) msg.acc = 0;
        msg.acc += d;
        if (Math.abs(msg.acc) >= SCROLL_STEP) {
          stepMessage(Math.sign(msg.acc));
          bump(1.2);   // hold the reveal long enough to read the new message once the twist settles
          msg.acc = 0;
          msg.lock = performance.now() + 700;
        }
      }

      addEventListener("pointermove", e => {
        s.tmx = (e.clientX / innerWidth) * 2 - 1;
        s.tmy = -((e.clientY / innerHeight) * 2 - 1);
        if (s.px !== null) {
          bump(Math.min(Math.hypot(e.clientX - s.px, e.clientY - s.py), 60) / 280);
          if (e.pointerType === "touch") scrollBy((s.py - e.clientY) * 2);   // swipe up = scroll down
        }
        s.px = e.clientX; s.py = e.clientY;
      });
      addEventListener("pointerdown", e => { s.px = e.clientX; s.py = e.clientY; bump(0.15); });
      // a new touch shouldn't count the jump from where the last one lifted
      const lift = e => { if (e.pointerType === "touch") s.px = s.py = null; };
      addEventListener("pointerup", lift);
      addEventListener("pointercancel", lift);
      document.documentElement.addEventListener("pointerleave", () => { s.px = s.py = null; });

      // ---------- phone tilt ----------
      // Tilt relative to however the phone is being held; the neutral pose slowly re-centres,
      // so holding still lets the letters sink back into the pattern.
      const tilt = { on: false, x: 0, y: 0, bx: 0, by: 0, lx: 0, ly: 0 };
      function onOrient(e) {
        if (e.beta == null || e.gamma == null) return;
        const a = (((screen.orientation && screen.orientation.angle) ?? window.orientation ?? 0) + 360) % 360;
        let x = e.gamma, y = e.beta;
        if (a === 90) { x = e.beta; y = -e.gamma; }
        else if (a === 270) { x = -e.beta; y = e.gamma; }
        else if (a === 180) { x = -e.gamma; y = -e.beta; }
        if (!tilt.on) { Object.assign(tilt, { on: true, bx: x, by: y, lx: x, ly: y }); }
        const d = Math.hypot(x - tilt.lx, y - tilt.ly);
        if (d > 0.15) bump(Math.min(d, 4) / 30);
        Object.assign(tilt, { x, y, lx: x, ly: y });
      }
      // Listen everywhere; browsers that gate motion sensors (iOS Safari) only start delivering
      // events once permission is granted, which must be asked from a user gesture.
      if (!still) addEventListener("deviceorientation", onOrient);
      if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
        addEventListener("touchend", () => DeviceOrientationEvent.requestPermission().catch(() => {}), { once: true });
      }
      addEventListener("wheel", e => scrollBy(e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY), { passive: true });
      addEventListener("keydown", e => {
        const k = { ArrowLeft: [-0.12, 0], ArrowRight: [0.12, 0], ArrowUp: [0, 0.12], ArrowDown: [0, -0.12] }[e.key];
        if (k) { s.tmx = Math.max(-1, Math.min(1, s.tmx + k[0])); s.tmy = Math.max(-1, Math.min(1, s.tmy + k[1])); bump(0.2); }
        if (e.key === " " || e.key === "PageDown" || e.key === "PageUp") {
          msg.lock = 0;
          scrollBy((e.key === "PageUp" ? -1 : 1) * SCROLL_STEP);
        }
      });

      const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const drift = reduced ? 0.2 : 1;
      const mix = (a, b, t) => a + (b - a) * t;
      const smooth = t => t * t * (3 - 2 * t);

      // ---------- frame loop ----------
      const t0 = performance.now();
      let last = t0;
      function frame(now) {
        const dt = Math.min(0.05, (now - last) / 1000);
        last = now;
        const t = still ? still.t : ((now - t0) / 1000) * drift;

        const ease = 1 - Math.exp(-dt * 3.5);
        s.mx += (s.tmx - s.mx) * ease;
        s.my += (s.tmy - s.my) * ease;
        const dScroll = (s.scroll - s.scrollS) * (1 - Math.exp(-dt * 5));
        s.scrollS += dScroll;
        s.twist *= Math.exp(-dt * 3.0);   // scroll twists the gratings apart; they spring back into register

        if (tilt.on) {
          const k = 1 - Math.exp(-dt / 6);
          tilt.bx += (tilt.x - tilt.bx) * k;
          tilt.by += (tilt.y - tilt.by) * k;
          s.tmx = Math.max(-1, Math.min(1, (tilt.x - tilt.bx) / 18));
          s.tmy = Math.max(-1, Math.min(1, -(tilt.y - tilt.by) / 18));
        }

        s.energy *= Math.exp(-dt * 0.75);
        const target = smooth(Math.min(1, s.energy));
        const rate = target > s.reveal ? 5.0 : 1.1;   // fast in, slow out
        s.reveal += (target - s.reveal) * (1 - Math.exp(-dt * rate));
        const r = still ? still.r : s.reveal;

        // Fringes drift at rest; as the reveal rises the phase locks to a whole cycle so the
        // letters stay dark instead of fading in and out as the drift passes a quarter cycle.
        let phase;
        if (still) {
          const p0 = still.t * 0.35;
          phase = mix(p0, Math.round(p0 / TAU) * TAU, r);
        } else {
          s.phase += dt * 0.35 * drift * (1 - r);
          s.phase += (Math.round(s.phase / TAU) * TAU - s.phase) * r * (1 - Math.exp(-dt * 3));
          phase = s.phase;
        }

        // At rest the two gratings are misaligned: dense fringes hide the letters.
        // Motion pulls them into register, the beat opens up, and the text inverts out.
        gl.uniform1f(U.uTime, t);
        gl.uniform1f(U.uSpin, s.scrollS * 0.0003 + 0.035 * s.mx - 0.02 * s.my + 0.01 * Math.sin(t * 0.07));
        gl.uniform1f(U.uAngle, mix(0.19, 0.0, r) + s.twist + 0.03 * s.mx + 0.004 * Math.sin(t * 0.11));
        gl.uniform1f(U.uCurve, mix(0.15, 0.0, r) + 0.03 * s.my);
        // Horizontal offset only: a vertical one is a uniform phase that would fade the letters.
        gl.uniform2f(U.uOffset, 0.025 * s.mx, 0.0);
        gl.uniform1f(U.uPhase, phase);
        gl.uniform1f(U.uShift, Math.PI * mix(0.28, 1.0, r));
        gl.uniform1f(U.uReveal, r);

        if (msg.k < 1) {
          msg.k = Math.min(1, msg.k + dt / 0.9);
          if (msg.k === 1) { msg.from = msg.to; bindMasks(); }
        }
        gl.uniform1f(U.uMix, msg.from === msg.to ? 0 : smooth(msg.k));

        gl.drawArrays(gl.TRIANGLES, 0, 3);
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    })();
  </script>
</body>
